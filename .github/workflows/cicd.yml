name: Webhux CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: 20
  PNPM_VERSION: 9

jobs:
  ci:
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (Turborepo)
        run: pnpm exec turbo run build

  docker:
    name: Build & Push Docker Images
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # -------- API --------
      - name: Build & Push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/webhux-api:latest
          build-args: |
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      # ------ WEBHOOK ------
      - name: Build & Push Webhook
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/webhook/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/webhux-webhook:latest
          cache-from: type=gha,scope=webhook
          cache-to: type=gha,mode=max,scope=webhook

      # -------- WEB --------
      - name: Build & Push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/webhux-web:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_WEBHOOK_BASE_URL=${{ secrets.NEXT_PUBLIC_WEBHOOK_BASE_URL }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web